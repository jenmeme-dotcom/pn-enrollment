<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title description">
  <title id="title">PN 107 Medical-Surgical Nursing Skills Lab</title>
  <desc id="description">Broward-Miami Health Institute Medical-Surgical Nursing artwork marked as the separate twelve-week Skills Lab course.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061d30" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#003f46" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001522" flood-opacity="0.45"/>
    </filter>
  </defs>
  <image href="02-pn-107-medical-surgical-nursing-i.png" width="1536" height="864" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1536" height="864" fill="url(#shade)"/>
  <g filter="url(#shadow)">
    <rect x="1030" y="56" width="434" height="174" rx="34" fill="#f7fbfc" stroke="#2ee2b2" stroke-width="7"/>
    <text x="1247" y="126" text-anchor="middle" fill="#00666d" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" letter-spacing="4">PN 107 LAB</text>
    <text x="1247" y="190" text-anchor="middle" fill="#072c43" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900">SKILLS LAB</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1018" y="740" width="458" height="78" rx="20" fill="#006f74" stroke="#42efbb" stroke-width="4"/>
    <text x="1247" y="792" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="2">12 WEEKS • 20 HOURS</text>
  </g>
